name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.14.0"

jobs:
  checks:
    name: Release Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './frontend/*'))"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:once

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
            artifact_name: devctx-linux-amd64
            nsis: "0"
            webview2: ""
            package_command: |
              mkdir -p dist
              tar -czf "dist/devctx_${RELEASE_VERSION}_linux_amd64.tar.gz" -C build/bin devctx
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact_name: devctx-windows-amd64
            nsis: "1"
            webview2: embed
            package_command: |
              mkdir -p dist
              installer="$(find build/bin -maxdepth 1 -type f -name '*installer.exe' | head -n 1)"
              if [ -z "${installer}" ]; then
                echo "Windows installer was not produced"
                find build/bin -maxdepth 2 -type f -print
                exit 1
              fi
              cp "${installer}" "dist/devctx_${RELEASE_VERSION}_windows_amd64_installer.exe"
          - name: macOS universal
            os: macos-latest
            platform: darwin/universal
            artifact_name: devctx-macos-universal
            nsis: "0"
            webview2: ""
            package_command: |
              mkdir -p dist
              app="$(find build/bin -maxdepth 1 -type d -name '*.app' | head -n 1)"
              if [ -z "${app}" ]; then
                echo "macOS app bundle was not produced"
                find build/bin -maxdepth 2 -print
                exit 1
              fi
              ditto -c -k --keepParent "${app}" "dist/devctx_${RELEASE_VERSION}_macos_universal.zip"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows installer dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis -y

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Build release artifact
        shell: bash
        env:
          DEVCTX_WAILS_PLATFORM: ${{ matrix.platform }}
          DEVCTX_WAILS_NSIS: ${{ matrix.nsis }}
          DEVCTX_WAILS_WEBVIEW2: ${{ matrix.webview2 }}
        run: scripts/build-release.sh "${RELEASE_VERSION}"

      - name: Package release artifact
        shell: bash
        run: ${{ matrix.package_command }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=v${version}" >> "${GITHUB_ENV}"

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## Install

          Download the artifact for your operating system:

          - Windows: \`devctx_${RELEASE_VERSION}_windows_amd64_installer.exe\`
          - macOS: \`devctx_${RELEASE_VERSION}_macos_universal.zip\`
          - Linux: \`devctx_${RELEASE_VERSION}_linux_amd64.tar.gz\`

          After installing, verify:

          \`\`\`bash
          devctx --version
          \`\`\`

          Dev Context expects the VS Code command-line launcher to be available as \`code\`.

          Checksums are in \`SHA256SUMS.txt\`.
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Dev Context ${{ env.RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
